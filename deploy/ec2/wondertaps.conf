server {
    listen 80;
    listen [::]:80;
    server_name wondertaps.in www.wondertaps.in;

    root /var/www/wondertaps/current;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(self)" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|webp|svg|ogg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
